# ── Umbrella(root) values ─────────────────────────────────────────────
# umbrella 차트의 핵심: 여기서 모든 서브차트의 설정을 내려준다.
#  - global:        → 모든 서브차트가 .Values.global 로 공유 (공통 레지스트리/시크릿 등)
#  - <서브차트이름>: → 해당 서브차트의 values 를 override (Helm 규칙)

global:
  imageRegistry: harbor.sre.local
  imagePullSecret: harbor-cred

# charts/frontend 의 values 를 덮어씀
frontend:
  replicaCount: 2
  image:
    registry: dev-harbor-aiteam.innogrid.com   # frontend 만 별도 레지스트리 (global override)
    repository: myservice2/react-demo
    tag: "v0.0.1"
  service:
    port: 3000    # react-demo 컨테이너 listen 포트
  # 브라우저 접속용 외부 노출. 클러스터에 Ingress Controller(nginx 등)가 설치돼 있어야 동작하고,
  # DNS/hosts 가 host 를 Ingress LB IP 로 가리켜야 한다.
  ingress:
    enabled: true
    className: nginx
    host: frontend.sample.local
    path: /

# charts/backend 의 values 를 덮어씀
backend:
  replicaCount: 3
  image:
    registry: dev-harbor-aiteam.innogrid.com   # backend 만 별도 레지스트리 (global override)
    repository: myservice/hello-spring
    tag: "v0.0.1"
  service:
    port: 8081    # hello-spring 컨테이너 listen 포트
  env:
    SPRING_PROFILES_ACTIVE: prod

# charts/db (PostgreSQL, StatefulSet)
db:
  image:
    repository: library/postgres
    tag: "16"
  auth:
    username: app
    password: "S3cretChangeMe"
    database: appdb
  persistence:
    size: 10Gi
  service:
    port: 5432

# charts/jenkins (오픈소스 CI)
jenkins:
  image:
    repository: jenkins/jenkins
    tag: "lts-jdk21"
  persistence:
    size: 20Gi
  service:
    port: 8080
  ingress:
    enabled: true
    className: nginx
    host: jenkins.sample.local
    path: /

# charts/argocd (오픈소스 CD, server 단순 예시)
argocd:
  image:
    repository: argoproj/argocd
    tag: "v2.13.0"
  service:
    port: 80
  ingress:
    enabled: true
    className: nginx
    host: argocd.sample.local
    path: /
