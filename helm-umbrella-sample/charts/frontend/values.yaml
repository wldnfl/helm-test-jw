# 서브차트 자체 기본값. root values.yaml 의 frontend: 블록이 이 값을 덮어쓴다.
# (root 가 값을 안 내려줄 때의 fallback)
replicaCount: 1
image:
  repository: myteam/frontend
  tag: latest
service:
  port: 3000
ingress:
  enabled: false        # root values 에서 켠다
  className: nginx      # 클러스터에 설치된 IngressClass 이름
  host: frontend.local
  path: /
  annotations: {}
