apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-frontend
    spec:
      {{- with (default dict .Values.global).imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: frontend
          # global.imageRegistry(공통) + 서브차트별 image 로 최종 이미지 구성
          # image.registry 가 있으면 그것을, 없으면 global.imageRegistry 를 사용 (서브차트별 레지스트리 override 허용)
          image: "{{ .Values.image.registry | default (default dict .Values.global).imageRegistry | default "docker.io" }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-frontend
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
