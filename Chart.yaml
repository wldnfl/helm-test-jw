apiVersion: v2
# name: sample-umbrella
description: 멀티 차트(umbrella) 배포 예시 — root chart 아래 charts/ 에 서브차트(frontend/backend/db/jenkins/argocd) vendoring
type: application
# version: 0.1.0
appVersion: "1.0.0"

# 서브차트는 charts/ 에 "실물"로 들어 있다(vendored). Helm 이 charts/ 안의 차트를 자동으로 서브차트로 포함하므로
# dependencies 선언 없이도 함께 렌더링된다.
#  - ArgoCD 가 `helm dependency build` 를 돌리지 않아 외부 repo 접근/Chart.lock 동기화가 전혀 필요 없다 (사내망에 가장 안전).
#  - 단, `helm lint` 는 "missing these dependencies" ERROR 를 낸다 — vendored 패턴에 대한 알려진 cosmetic 경고로
#    `helm template`/ArgoCD 렌더에는 영향 없음. lint 까지 깔끔히 하려면 dependencies(file://) 선언 + `helm dependency update`
#    로 Chart.lock 을 생성하면 되지만, 그러면 서브차트 수정 시마다 lock 을 다시 맞춰야 한다.
