apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-argocd-server
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-argocd-server
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-argocd-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-argocd-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-argocd-server
    spec:
      {{- with (default dict .Values.global).imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: argocd-server
          image: "{{ (default dict .Values.global).imageRegistry | default "docker.io" }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["argocd-server"]
          ports:
            - containerPort: 8080
